<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Hymnal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Table of Contents View -->
        <div id="toc-view" class="view active">
            <div class="header">
                <h1>Hymnal</h1>
                <button id="add-song-btn" class="add-btn">+ Add Song</button>
            </div>
            <div id="song-list" class="song-list">
                <!-- Songs will be dynamically populated here -->
            </div>
        </div>

        <!-- Song View -->
        <div id="song-view" class="view">
            <div class="song-header">
                <button id="back-to-toc" class="back-btn">← Back to Songs</button>
                <button id="edit-song-btn" class="edit-btn">Edit</button>
            </div>
            <div id="song-content">
                <!-- Song content will be displayed here -->
            </div>
        </div>

        <!-- Add/Edit Song Form -->
        <div id="form-view" class="view">
            <div class="form-header">
                <h2 id="form-title">Add New Song</h2>
                <button id="cancel-form" class="cancel-btn">Cancel</button>
            </div>
            <form id="song-form">
                <div class="form-group">
                    <label for="song-title">Song Title:</label>
                    <input type="text" id="song-title" required>
                </div>
                <div class="form-group">
                    <label for="song-lyrics">Lyrics:</label>
                    <textarea id="song-lyrics" rows="15" placeholder="Enter lyrics here...&#10;&#10;Use empty lines to separate verses.&#10;Start lines with 'Chorus:' for chorus sections." required></textarea>
                </div>
                <div class="form-actions">
                    <button type="submit" id="save-song">Save Song</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
